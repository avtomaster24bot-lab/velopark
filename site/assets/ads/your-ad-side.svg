<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" font-family="Manrope,Segoe UI,Arial,sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b6e5a"/><stop offset="1" stop-color="#14231f"/></linearGradient></defs><rect width="360" height="600" fill="url(#g)"/>
